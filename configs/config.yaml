server:
  port: "8080"
  read_timeout: 30s
  write_timeout: 60s

redis:
  addr: "redis:6379"
  password: ""
  db: 0
  ttl: 24h

llm:
  provider: "ollama"       # ollama | openai
  openai_api_key: ""       # set via env: OPENAI_API_KEY
  openai_model: "gpt-3.5-turbo"
  ollama_url: "http://ollama:11434"
  ollama_model: "llama3"
  timeout: 30s
  max_concurrency: 5       # semaphore: max parallel LLM calls

analyzer:
  oi_change_threshold: 20.0  # % change to flag as significant
